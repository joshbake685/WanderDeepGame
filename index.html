<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Wander Deep</title>
	<style>
		body {
			margin: 0;
		}
	</style>
</head>

<body>
	<script type="module" src="./src/main.js"></script>
	<div id="overlay" style="display: none;">
		<div id="end-screen">
			<h1 id="end-message">You Died</h1>
			<button id="restart-button" onclick="restartGame()">Restart</button>
		</div>
	</div>

	<style>
		#overlay {
			transition: background-color 0.5s ease;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.85);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 10;
		}

		#end-screen {
			text-align: center;
			color: white;
			font-family: sans-serif;
		}

		#end-screen button {
			padding: 10px 20px;
			font-size: 18px;
			margin-top: 20px;
		}
	</style>

</body>

</html>
